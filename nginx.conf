# ============================================================
# E时代信任中心 - 前端 + API 生产部署配置 (nginx)
# 使用前请替换三处占位符：
#   1. server_name        -> 你的真实域名
#   2. root               -> 前端构建产物目录 (client/build 的绝对路径)
#   3. 证书路径(启用HTTPS时) -> /path/to/your/fullchain.pem 等
# ============================================================

# 后端服务(与 nginx 同机时用 127.0.0.1；跨机时改为后端内网IP)
upstream trust_backend {
    server 127.0.0.1:3000;
    keepalive 32;          # 复用后端连接，减少握手
}

